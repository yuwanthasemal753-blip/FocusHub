<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusHub - A/L Study Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Hide all possible Netlify injected badges/toolbars */
        iframe[id^="netlify"], ast-badge, .netlify-badge, #netlify-badge, div[style*="z-index: 99999"], a[href*="netlify.com"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">
    <div class="max-w-4xl mx-auto p-6 w-full">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">FocusHub</h1>
                <p class="text-xs text-slate-400">A/L Physical Science Study Dashboard</p>
            </div>
            <div id="auth-status" class="text-sm bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-slate-300">
                <span>⚡ System Online</span>
            </div>
        </header>

        <main class="space-y-6">
            <section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-3 text-cyan-400">🎯 Welcome to FocusHub</h2>
                <p class="text-slate-300 text-sm leading-relaxed">
                    Your real-time productivity hub, pomodoro tracker, and leaderboard platform designed for Advanced Level examination preparation.
                </p>
            </section>
        </main>
    </div>

    <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900">
        FocusHub &copy; 2026 - All Rights Reserved
    </footer>
</body>
</html>
